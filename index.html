<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Abercrombie & Fitch - $500 Reward</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "EB Garamond", Georgia, serif;
      background: linear-gradient(135deg, #f5f5f5, #fff, #fafafa);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      color: #343434;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .notification-banner {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: #fffffffa;
      color: #343434;
      padding: 12px 24px;
      border-radius: 8px;
      box-shadow: 0 8px 32px #34343426;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 500;
      z-index: 1000;
      width: calc(100% - 2rem);
      max-width: 360px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(52, 52, 52, 0.1);
      animation: slideDown 0.3s ease-out;
    }

    .notification-banner.show {
      display: flex;
    }

    .notification-icon {
      font-size: 20px;
    }

    .notification-text {
      font-weight: 400;
    }

    .notification-name {
      font-weight: 700;
    }

    .main-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      position: relative;
      z-index: 2;
    }

    .card {
      background: #fff;
      border-radius: 4px;
      padding: 32px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px #3434341f, 0 8px 24px #34343414;
      border: 1px solid rgba(52, 52, 52, 0.15);
      animation: cardFloat 4s ease-in-out infinite;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      padding-bottom: 0;
    }

    .logo-text {
      font-family: "EB Garamond", Georgia, serif;
      font-size: 32px;
      font-weight: 600;
      color: #1a1a1a;
      letter-spacing: -0.5px;
      text-align: center;
      line-height: 1.2;
    }

    .reward-amount {
      font-size: 52px;
      font-weight: 700;
      color: #343434;
      margin: 20px 0 10px;
      letter-spacing: -2px;
      text-align: center;
      animation: amountPulse 2.5s ease infinite;
    }

    .reward-label {
      font-size: 12px;
      font-weight: 600;
      color: #343434;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.75;
      text-align: center;
    }

    .instructions {
      margin: 28px 0 24px;
      padding: 22px;
      background: #34343408;
      border-radius: 4px;
      border: 1px solid rgba(52, 52, 52, 0.08);
    }

    .instruction-step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 9px 0;
      font-size: 14px;
      color: #343434;
      line-height: 1.5;
    }

    .step-number {
      background: #343434;
      color: #fff;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 3px 8px #34343440;
    }

    .step-text {
      font-weight: 500;
      padding-top: 2px;
    }

    .cta-button {
      background: #343434;
      color: #fff;
      border: none;
      padding: 16px 28px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 13px;
      width: 100%;
      cursor: pointer;
      margin: 20px 0 0;
      display: block;
      box-shadow: 0 12px 32px #3434344d, 0 4px 12px #34343433;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      text-align: center;
      font-family: "EB Garamond", Georgia, serif;
    }

    .cta-button:hover {
      background: #1a1a1a;
      transform: translateY(-2px);
      box-shadow: 0 16px 40px #34343466, 0 6px 16px #3434344d;
    }

    .cta-button:active {
      transform: translateY(0);
    }

    @keyframes slideDown {
      0% {
        transform: translate(-50%, -100%);
        opacity: 0;
      }
      to {
        transform: translate(-50%);
        opacity: 1;
      }
    }

    @keyframes cardFloat {
      0%,
      to {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes amountPulse {
      0%,
      to {
        transform: scale(1);
      }
      50% {
        transform: scale(1.03);
      }
    }

    @media screen and (max-width: 768px) {
      .card {
        padding: 28px 24px;
        margin: 0;
        animation: none;
      }
      .reward-amount {
        font-size: 48px;
      }
      .instructions {
        padding: 20px;
        margin: 24px 0 20px;
      }
      .main-container {
        padding: 10px;
      }
      .card-header {
        margin-bottom: 10px;
      }
      .instruction-step {
        padding: 8px 0;
        font-size: 13px;
      }
      .cta-button {
        margin: 20px 0 0;
        padding: 15px 24px;
      }
      .logo-text {
        font-size: 28px;
      }
    }

    @media screen and (max-width: 480px) {
      .reward-amount {
        font-size: 44px;
        margin: 16px 0 8px;
      }
      .reward-label {
        font-size: 11px;
        letter-spacing: 2px;
      }
      .cta-button {
        padding: 15px 20px;
        font-size: 12px;
      }
      .logo-text {
        font-size: 24px;
      }
      .card {
        padding: 24px 20px;
      }
      .instructions {
        padding: 18px;
        margin: 20px 0 18px;
      }
    }

    @media screen and (max-height: 750px) {
      .card {
        padding: 22px 20px;
      }
      .card-header {
        margin-bottom: 8px;
      }
      .reward-amount {
        font-size: 42px;
        margin: 14px 0 8px;
      }
      .reward-label {
        font-size: 11px;
      }
      .instructions {
        margin: 18px 0 16px;
        padding: 18px;
      }
      .instruction-step {
        padding: 7px 0;
        font-size: 13px;
      }
      .cta-button {
        margin: 16px 0 0;
        padding: 14px 20px;
        font-size: 12px;
      }
      .logo-text {
        font-size: 22px;
      }
      .step-number {
        width: 22px;
        height: 22px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="notification-banner" id="notification">
    <span class="notification-icon">✨</span>
    <div class="notification-text">
      <span class="notification-name" id="notif-name">Jordan P.</span> claimed $500!
    </div>
  </div>

  <div class="main-container">
    <div class="card">
      <div class="card-header">
        <div class="logo-text">Abercrombie & Fitch</div>
      </div>

      <div style="text-align: center;">
        <div class="reward-amount">$500</div>
        <div class="reward-label">EXCLUSIVE OFFER</div>
      </div>

      <div class="instructions">
        <div class="instruction-step">
          <span class="step-number">1</span>
          <span class="step-text">Click The Button Below</span>
        </div>
        <div class="instruction-step">
          <span class="step-number">2</span>
          <span class="step-text">Enter Your Basic Info</span>
        </div>
        <div class="instruction-step">
          <span class="step-number">3</span>
          <span class="step-text">Complete Required Offers</span>
        </div>
        <div class="instruction-step">
          <span class="step-number">4</span>
          <span class="step-text">Claim Your Reward</span>
        </div>
      </div>

      <a
        href="https://linkthem.net/?offer_id=3865&aff_id=145283"
        target="_blank"
        rel="noopener noreferrer"
        class="cta-button"
      >
        CLAIM YOUR REWARD →
      </a>
    </div>
  </div>

  <script>
    const names = [
      "Jordan P.",
      "Taylor S.",
      "Alex M.",
      "Casey R.",
      "Morgan L.",
      "Riley K.",
      "Jamie T.",
      "Avery B.",
      "Quinn H.",
      "Cameron D."
    ];

    const notification = document.getElementById("notification");
    const notifName = document.getElementById("notif-name");
    let index = 0;

    function showNotification() {
      notifName.textContent = names[index];
      notification.classList.add("show");

      setTimeout(() => {
        notification.classList.remove("show");
      }, 3500);

      index = (index + 1) % names.length;
    }

    // First notification after a short delay
    setTimeout(showNotification, 1500);

    // Then every 6 seconds
    setInterval(showNotification, 6000);
  </script>
</body>
</html>
